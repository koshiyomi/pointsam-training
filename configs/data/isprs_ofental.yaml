# Cherlet et al. ISPRS TLS benchmark — Ofental (temperate conifer). Same PLY schema as Wytham.
source_dir: data/raw/isprs_ofental
out_dir: data/ofental_isprs
strips:
  train: ofental_train.ply
  val: ofental_val.ply
  test: ofental_test.ply

voxel_m: 0.05
tile_m: 30.0
crop_m: 12.0
stride_m: 6.0
min_crop_points: 2048
max_crop_points: 100000
min_crop_trees: 1
seed: 0

csf: {resolution: 0.5, threshold: 0.5, iterations: 500, rigidness: 1}
