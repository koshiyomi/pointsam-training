# Same as isprs_wytham.yaml, but raw PLYs live inside the repo so Colab does not
# need the ICE-style ../Dataset/... layout. scripts/setup_colab.py downloads here.
source_dir: data/raw/isprs_wytham
out_dir: data/wytham_isprs
strips:
  train: wytham_train.ply
  val: wytham_val.ply
  test: wytham_test.ply

voxel_m: 0.05
tile_m: 30.0
crop_m: 12.0
stride_m: 6.0
min_crop_points: 2048
max_crop_points: 100000
min_crop_trees: 1
seed: 0

csf: {resolution: 0.5, threshold: 0.5, iterations: 500, rigidness: 1}
