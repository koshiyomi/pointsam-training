# Florida Cedar Key black mangrove single-tree crops (after scripts/ingest_cedar_key.py).
run: cedar_key_lora
adapter: lora
data_dir: data/cedar_key_mangrove/crops
checkpoint: thirdparty/checkpoints/point_sam/model.safetensors
out_dir: results/cedar_key_lora

num_points: 10000
num_masks: 4
val_num_masks: 2
min_mask_points: 40
val_max_crops: 64

batch_size: 1
grad_accum: 2
num_workers: 2
max_steps: 1500
log_every: 25
val_every: 100
early_stop_patience: 6

lr: 1.0e-4
encoder_lr: 2.0e-4
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 75
min_lr_frac: 0.05
seed: 0

lora_rank: 8
lora_alpha: 16
group_number: 512
group_size: 64

first_round_weight: 3.0
click_mix: {stem: 0.4, stem1: 0.2, random: 0.2, interior: 0.2}
val_click: stem
select_metric: val_iou_pick

use_augmentation: true
augmentation:
  p_density: 0.5
  p_occlusion: 0.4
  p_height: 0.3
  jitter: 0.01
  tilt_deg: 3
