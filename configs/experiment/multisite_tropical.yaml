# Wytham + Robson Creek (+ optional Litchfield after combine). Tropical transfer track.
run: multisite_tropical
adapter: lora
data_dir: data/multisite_tropical/crops
checkpoint: thirdparty/checkpoints/point_sam/model.safetensors
out_dir: results/multisite_tropical

num_points: 10000
num_masks: 8
val_num_masks: 4
min_mask_points: 40
val_max_crops: 56

batch_size: 1
grad_accum: 2
num_workers: 2
max_steps: 3000
log_every: 25
val_every: 200
early_stop_patience: 6

lr: 1.0e-4
encoder_lr: 2.0e-4
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 150
min_lr_frac: 0.05
seed: 0

lora_rank: 8
lora_alpha: 16
group_number: 512
group_size: 64

first_round_weight: 3.0
click_mix: {stem: 0.4, stem1: 0.2, random: 0.2, interior: 0.2}
val_click: stem
select_metric: val_iou_pick

use_augmentation: true
augmentation:
  p_density: 0.5
  p_occlusion: 0.4
  p_height: 0.3
  jitter: 0.01
  tilt_deg: 3
